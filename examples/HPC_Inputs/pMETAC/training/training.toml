[nn]
systems = [
	"pmetac-15_005",
	]

n_epochs = 150              # Number of training iterations
equilibration = 400000      # Whether to run N equilibration steps before the differentiable dynamics; 2ns
grad_method = "reverse"     # implemented even other 2 methods, jvp nad finite diff. but for CG reverse is the best
teacher_forcing = true      # Whether to use the last positions and velocities as starting point for the next epoch
chain = false               # Whether to chain different optimizers, see example below
shuffle = true              # Whether to shuffle the indices of dataset at the start of each epoch. 
batch_size = 1
clear_xla_cache = 1

[nn.optimizer]
name ='adabelief' 
#name ='adam'              #'adabelief'
learning_rate = 0.0002
b1 = 0.1
b2 = 0.4

# This section specifies the loss function and its parameters
[nn.loss]
name = 'radius_of_gyration_dist' 
metric = "wasserstein_1d"
constraint = "harmonic"     # Individual chi pairs constraints, see below
k_constraint = 1.0      # Strength of the constraint
boundary = 20
boundary_S = 2

# System sepcific loss arguments (can be mixed-matched with the ones above for better control)
[nn.system_args.pmetac-15_005]
target_dist = 'target_pdf.npy'
resname = "PCP"
n_chains = 1
width_ratio = 1.0               #around 1-5

