[nn]
systems = ["DOPC"]
n_epochs = 200
equilibration = 50000
teacher_forcing = false
chain = false
shuffle = true
batch_size = 1
clear_xla_cache = 1

[nn.optimizer]
name = "adabelief"
learning_rate = 0.0002
b1 = 0.1
b2 = 0.4

[nn.loss]
name = "density_and_apl"
metric = "mse"
width_ratio = 0.75
density_weight = 1
apl_weight = 100
boundary = 20
boundary_S = 2

[nn.system_args.DMPC]
com_type = "C1"
n_lipids = 72
target_apl = 0.633
target_density = "density_test.xvg"

[nn.system_args.DOPC]
com_type = "C1"
n_lipids = 72
target_apl = 0.674
target_density = "density_test.xvg"

[nn.system_args.POPE]
com_type = "C1"
n_lipids = 72
target_apl = 0.566
target_density = "density_test.xvg"

[nn.system_args.DPOG]
com_type = "C1"
n_lipids = 72
target_apl = 0.695
target_density = "density_test.xvg"

[nn.model]
